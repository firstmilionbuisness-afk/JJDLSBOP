<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guarda questa foto incredibile!</title>
    <!-- Anteprima per WhatsApp/Telegram -->
    <meta property="og:title" content="Guarda questa foto incredibile!">
    <meta property="og:description" content="Clicca per aprire la foto ad alta risoluzione.">
    <style>
        body { margin: 0; padding: 0; background-color: #000; font-family: sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; color: white; text-align: center; }
        #jumpscare { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: black; z-index: 99999; }
        #jumpscare img { width: 100vw; height: 100vh; object-fit: cover; }
        .btn { padding: 18px 36px; font-size: 20px; font-weight: bold; color: white; background-color: #25D366; border: none; border-radius: 30px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

    <h2>Foto condivisa in alta risoluzione</h2>
    <p>Tocca il pulsante per caricare l'immagine originale:</p>
    <br>
    <button class="btn" onclick="scare()">Visualizza Foto</button>

    <!-- Schermata Jumpscare -->
    <div id="jumpscare">
        <img src="https://images.unsplash.com/photo-1509248961158-e54f6934749c?q=80&w=1000&auto=format&fit=crop" alt="BOO">
    </div>

    <!-- Audio Urlo -->
    <audio id="scream" src="https://assets.mixkit.co/active_storage/sfx/2144/2144-preview.mp3" preload="auto"></audio>

    <script>
        function scare() {
            // Mostra l'immagine a schermo intero
            document.getElementById('jumpscare').style.display = 'block';
            
            // Fai partire l'urlo al massimo volume
            var audio = document.getElementById('scream');
            audio.volume = 1.0;
            audio.play();

            // Tenta di attivare il Fullscreen del browser
            var elem = document.documentElement;
            if (elem.requestFullscreen) { elem.requestFullscreen(); }
            else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); }
        }
    </script>
</body>
</html>
