<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video esclusivo in HD</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #000; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; color: white; }
        
        .player-box { width: 90%; max-width: 400px; height: 250px; background: #111; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 2px solid #333; cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .play-btn { width: 70px; height: 70px; background: rgba(255, 0, 0, 0.9); border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 20px rgba(255,0,0,0.6); }
        .play-btn::after { content: ""; display: block; width: 0; height: 0; border-style: solid; border-width: 12px 0 12px 22px; border-color: transparent transparent transparent white; margin-left: 5px; }
        .player-text { margin-top: 15px; font-size: 14px; color: #bbb; text-align: center; }

        #scare-screen { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: black; z-index: 999999; }
        #scare-screen img { width: 100vw; height: 100vh; object-fit: cover; }
    </style>
</head>
<body>

    <div class="player-box" onclick="triggerJumpscare()">
        <div class="play-btn"></div>
        <div class="player-text">Tocca per riprodurre in HD</div>
    </div>

    <!-- Usa la tua immagine caricata -->
    <div id="scare-screen">
        <img src="spavento.jpg" alt="Jumpscare">
    </div>

    <!-- Usa il tuo file audio caricato -->
    <audio id="scare-audio" preload="auto">
        <source src="urlo.mp3" type="audio/mpeg">
    </audio>

    <script>
        var audio = document.getElementById('scare-audio');
        
        // Sblocca l'audio su iPhone al primo tocco
        document.body.addEventListener('touchstart', function() {
            audio.play().then(() => {
                audio.pause();
                audio.currentTime = 0;
            }).catch(() => {});
        }, {once: true});

        function triggerJumpscare() {
            var screen = document.getElementById('scare-screen');
            
            // Schermo intero
            var elem = document.documentElement;
            if (elem.requestFullscreen) { elem.requestFullscreen(); }
            else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); }

            // Mostra l'immagine personalizzata
            screen.style.display = 'block';

            // Riproduci l'urlo al massimo volume
            audio.volume = 1.0;
            audio.currentTime = 0;
            audio.play();
        }
    </script>
</body>
</html>
